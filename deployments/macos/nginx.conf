events { worker_connections 256; }
http {
  access_log off;
  client_max_body_size 100m;
  proxy_read_timeout 590s;
  proxy_send_timeout 590s;
  proxy_buffering off;
  server {
    listen 8502;
    location / { proxy_pass http://open_notebook:8502; proxy_set_header Host $http_host; }
  }
  server {
    listen 5055;
    location / { proxy_pass http://open_notebook:5055; proxy_set_header Host $http_host; }
  }
  server {
    listen 11436;
    location / { proxy_pass http://host.docker.internal:11437; }
  }
  server {
    listen 8880;
    location / { proxy_pass http://kokoro:8880; }
  }
}
